[claude_mask_bearer]
REGEX = (?i)(Bearer\s+)([^\s\"\\]+)
FORMAT = $1***REDACTED***
DEST_KEY = _raw

[claude_mask_auth_header]
REGEX = (?i)("Authorization"\s*:\s*"Bearer\s+)([^"]+)
FORMAT = $1***REDACTED***
DEST_KEY = _raw

[claude_mask_auth_token_env]
REGEX = (?i)(AUTH_TOKEN["\']?\s*[:=]\s*)([^\s,}"]+)
FORMAT = $1***REDACTED***
DEST_KEY = _raw
