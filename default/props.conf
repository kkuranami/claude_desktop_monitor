[claude:desktop:main]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 24
TRUNCATE = 0
EXTRACT-log_level = ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[(?<log_level>\w+)\]
EXTRACT-component = ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[\w+\]\s+\[(?<component>[^\]]+)\]

[claude:desktop:mcp]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 24
TRUNCATE = 0
TRANSFORMS-claude_redact = claude_mask_bearer, claude_mask_auth_header, claude_mask_auth_token_env
EXTRACT-mcp_fmt = ^\S+Z (?:\[(?<log_level>\w+)\]\s+\[(?<mcp_server>[^\]]+)\]|\[(?<mcp_server_b>[^\]]+)\]\s+\[(?<log_level_b>\w+)\])\s+(?<message>.*)
EXTRACT-mcp_server_from_source = mcp-server-(?<mcp_server_from_source>[^/]+)\.log

